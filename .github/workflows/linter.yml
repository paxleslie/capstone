name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android_app/**/*.gradle*', 'android_app/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android_app/local.properties
          echo "SUPABASE_URL=\"$SUPABASE_URL\"" >> android_app/local.properties
          echo "SUPABASE_KEY=\"$SUPABASE_KEY\"" >> android_app/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android_app/gradlew

      - name: Run Android lint
        working-directory: android_app
        run: ./gradlew lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            android_app/app/build/reports/lint-results-*.html
            android_app/app/build/reports/lint-results-*.xml
            android_app/app/build/reports/lint-results-*.txt
